# Runs the paper bot on GitHub's servers, so it keeps going with your PC off.
# Every hour GitHub starts a run (best effort: it can be late or skipped):
#   - during the US session (weekdays 14:00-20:59 UTC) the run ticks every 5 minutes until 21:00 UTC;
#   - otherwise it ticks once (the night rule, ETH 1h breakdown, only needs hourly checks).
# Start it by hand any time with "Run workflow".
name: paper-bot
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tick
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          tick() {
            git pull -q --rebase origin main || true
            python bot.py tick || echo "tick failed"
            python review.py --if-older 115 || echo "review failed"   # backup for the 2-hourly review job
            git add state.json trades.jsonl report.md review.md overrides.json
            git diff --cached --quiet || git commit -q -m "bot tick $(date -u +%H:%M)"
            git push -q origin HEAD:main || echo "push failed"
          }
          in_session() { [ "$(date -u +%u)" -le 5 ] && [ "$(date -u +%H)" -ge 14 ] && [ "$(date -u +%H)" -lt 21 ]; }
          tick
          while in_session; do sleep 300; tick; done
