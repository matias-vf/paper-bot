# Runs the paper bot on GitHub's servers, so it keeps going with your PC off.
# Every hour GitHub starts a run (best effort: it can be late or skipped). Each run ticks every
# 2 minutes for 5.5 hours, so exits are watched closely; the strategies themselves decide on hourly bars.
name: paper-bot
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tick
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          tick() {
            git pull -q --rebase origin main || true
            python bot.py tick || echo "tick failed"
            python review.py --every-trades 5 || echo "review failed"   # reviews after every 5 closed trades
            git add state.json trades.jsonl report.md review.md overrides.json news.md
            git diff --cached --quiet || git commit -q -m "bot tick $(date -u +%H:%M)"
            git push -q origin HEAD:main || echo "push failed"
          }
          # every run loops for 5.5 h, a tick every 2 minutes, day or night; the hourly schedule restarts it
          START=$(date +%s)
          tick
          while [ $(( $(date +%s) - START )) -lt 19800 ]; do sleep 120; tick; done
