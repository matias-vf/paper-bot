# Runs the paper bot on GitHub's servers, so it keeps going with your PC off.
# One run loops for ~5.5 hours, ticking every 5 minutes and saving the ledger after each tick.
# GitHub's scheduler is best-effort (it can skip or delay runs), so the hourly schedule only
# restarts the loop if it is not already running; start it by hand with "Run workflow".
name: paper-bot
on:
  schedule:
    - cron: "7 14-20 * * 1-5"   # US session hours only (UTC): crypto is off, nothing to do at night
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tick every 5 minutes for ~5.5 hours
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          for i in $(seq 1 66); do
            git pull -q --rebase origin main || true
            python bot.py tick || echo "tick $i failed"
            git add state.json trades.jsonl report.md
            git diff --cached --quiet || git commit -q -m "bot tick $(date -u +%H:%M)"
            git push -q origin HEAD:main || echo "push $i failed"
            sleep 300
          done
