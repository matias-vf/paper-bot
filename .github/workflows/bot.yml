# Runs the paper bot every 5 minutes on GitHub's servers, so it keeps going with your PC off.
# GitHub may delay scheduled runs by several minutes at busy times.
name: paper-bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py tick
      - name: Save the ledger
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state.json trades.jsonl report.md
          git diff --cached --quiet || git commit -m "bot tick $(date -u +%H:%M)"
          git push
